reflex_grasp_node:
  ros__parameters:

    # ── 접촉 감지 ────────────────────────────────────────────────────────────
    contact_delta_threshold: 0.05    # ready 대비 Δθ 합산 [rad]
    min_finger_triggers: 1

    # ── grasp_3 완료 판정 ────────────────────────────────────────────────────
    # grasp_3 목표각 대비 현재각 오차가 이 값 이하면 완료로 판정
    grasp_reach_threshold: 0.15      # [rad]

    # ── 부하(토크) 감지 ──────────────────────────────────────────────────────
    # effort 절댓값이 이 값 이상이면 물체 접촉(부하) 판정
    effort_contact_threshold: 0.3    # [Nm]
    min_effort_fingers: 1            # 몇 개 손가락 이상 부하 감지 시 SNN 시작

    # ── SNN Slip 감지 ────────────────────────────────────────────────────────
    slip_threshold:        0.001
    snn_tau_slip:          0.03

    # ── Slip 보상 ────────────────────────────────────────────────────────────
    slip_target_increment: 0.05      # spike 시 목표각 증가량 [rad]
    slip_target_max:       1.57      # 목표각 상한 [rad]

    # ── 안정화 ───────────────────────────────────────────────────────────────
    settle_frames: 400
    grasp_hold_sec: 0.0
