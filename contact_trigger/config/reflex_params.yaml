reflex_grasp_node:
  ros__parameters:

    # ── SNN 접촉 감지 ────────────────────────────────────────────────────────
    # LIF 정상상태 막전위 = Σ|Δθ| × tau
    # 손가락 5° 움직임 ≈ Σ|Δθ| = 0.35 rad
    # V_ss = 0.35 × 0.05 = 0.0175
    # → threshold 는 V_ss 보다 낮아야 발화 가능
    contact_threshold: 0.01    # (기존 1.0 → 수정. 0.35rad 입력 시 약 0.3s 후 발화)

    # LIF 시상수 [s]: 클수록 자극이 오래 누적됨
    snn_tau_contact: 0.05

    # 최소 발화 손가락 수 (1 = 하나만 닿아도 grasp)
    min_finger_triggers: 1

    # ── SNN Slip 감지 ────────────────────────────────────────────────────────
    # slip LIF 정상상태 = position_error × tau_slip
    # 0.05rad slip × 0.03 = 0.0015 → threshold 이보다 낮게
    slip_threshold: 0.001

    # slip SNN 시상수 [s]
    snn_tau_slip: 0.03

    # ── 물체 크기 적응 ───────────────────────────────────────────────────────
    object_contact_vel_threshold: 0.005

    # ── 천천히 닫기 속도 ─────────────────────────────────────────────────────
    grasp_speed: 0.7
    grasp_speed_max: 1.0

    # ── 기타 ─────────────────────────────────────────────────────────────────
    settle_frames: 300
    grasp_hold_sec: 0.0