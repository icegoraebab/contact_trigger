reflex_grasp_node:
  ros__parameters:

    # ── 접촉 감지 (단순 임계값 비교) ────────────────────────────────────────
    # 손가락 살짝 건드림 ≈ Σ|Δθ| 0.05 rad 이상
    contact_delta_threshold: 0.05   # [rad] 이 값 넘으면 grasp 트리거
    min_finger_triggers: 1          # 몇 개 손가락 이상 감지 시 트리거

    # ── SNN Slip 감지 ────────────────────────────────────────────────────────
    # slip = cmd_MCP - cur_MCP (목표보다 실제가 열려있는 정도)
    # LIF 뉴런이 이 값을 적분 → threshold 초과 → spike → target 증가
    slip_threshold:  0.001          # LIF 발화 임계치
    snn_tau_slip:    0.03           # slip SNN 시상수 [s]

    # ── Slip 보상 ────────────────────────────────────────────────────────────
    slip_target_increment: 0.05     # spike 시 목표각 증가량 [rad]
    slip_target_max:       1.57     # 목표각 상한 [rad] (90도)

    # ── 닫기 속도 ────────────────────────────────────────────────────────────
    grasp_speed: 0.3                # [rad/s]

    # ── 물체 크기 적응 ───────────────────────────────────────────────────────
    object_contact_vel_threshold: 0.008   # [rad/s] 이하면 물체 접촉 판정

    # ── 안정화 ───────────────────────────────────────────────────────────────
    settle_frames:  400             # 100Hz × 4s
    grasp_hold_sec: 0.0             # 0 = 무한 유지
