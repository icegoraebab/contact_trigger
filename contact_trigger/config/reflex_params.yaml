reflex_grasp_node:
  ros__parameters:

    # ── SNN 접촉 감지 ─────────────────────────────────────────────────────────
    # V_ss = Σ|Δθ| × tau  (5° 움직임 → 0.35rad × 0.05 = 0.0175)
    # threshold < V_ss 이어야 발화 가능
    contact_threshold:   0.007   # ~0.3초 누적 후 발화, 터치 민감도 조절
    snn_tau_contact:     0.05
    min_finger_triggers: 1

    # ── SNN slip 감지 ─────────────────────────────────────────────────────────
    snn_tau_slip:   0.03
    slip_threshold: 0.001

    # ── envelop torque 적응 제어 ──────────────────────────────────────────────
    #
    # 동작 원리:
    #   slip 발생  → torque += torque_step_up   (즉시 조금 올림)
    #   slip 없음  → torque *= torque_decay_rate (서서히 내림)
    #   → slip이 막 멈추는 최소 토크로 자동 수렴
    #
    torque_min:         0.3    # 최소 토크 (grasp_3 기본 시작값)
    torque_max:         0.7    # 최대 토크 (손/물체 보호 상한)
    torque_step_up:     0.03   # slip 1회당 +3% 증가
    torque_decay_rate:  0.995  # slip 없으면 매 tick 0.5% 감소

    # ── 기타 ─────────────────────────────────────────────────────────────────
    settle_frames:  300     # 100Hz × 3s
    grasp_hold_sec: 0.0     # 0 = 무한 유지