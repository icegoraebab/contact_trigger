reflex_grasp_node:
  ros__parameters:

    # ── SNN 접촉 감지 ─────────────────────────────────────────────────────────
    # 낮을수록 민감 / 높을수록 둔감
    contact_threshold:   0.012
    snn_tau_contact:     0.05
    min_finger_triggers: 1

    # ── SNN slip 감지 ─────────────────────────────────────────────────────────
    snn_tau_slip:   0.03
    slip_threshold: 0.001

    # ── 천천히 닫기 ───────────────────────────────────────────────────────────
    # 0.05=매우느림(14s) / 0.10=느림(7s) / 0.20=기본(3.5s) / 0.50=빠름(1.4s)
    grasp_speed: 0.20

    # ── slip 대응 ─────────────────────────────────────────────────────────────
    # slip spike 1회당 목표 관절각 추가로 닫는 양 [rad]
    # 크면 빠르게 수렴, 작으면 천천히 수렴
    slip_push: 0.02

    # ── 기타 ─────────────────────────────────────────────────────────────────
    settle_frames:  300
    grasp_hold_sec: 0.0